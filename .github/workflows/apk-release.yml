name: TivaChat APK — test, build, sign, publish

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "tools/**"
      - "ml/**"
      - "tests/**"
      - ".github/workflows/apk-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "versionName (مثال: 1.0.2)"
        required: true
        default: "1.0.3"
      publish:
        description: "انتشار در گیت‌هاب و به‌روزرسانی لینک دانلود"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tiva-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Engine + native gates (no secrets needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test deps
        run: npm install --no-audit --no-fund
      - name: Engine regression (v1.0.1 behaviours)
        run: node tests/engine.test.mjs
      - name: v1.0.2 regression (noon, camera, honesty, dataset, aliases)
        run: node tests/v102.test.mjs
      - name: Native safety checks
        run: python3 tests/native_checks.py

  apk:
    name: Build + sign + publish APK
    needs: tests
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || '1.0.3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (command line tools + build-tools 34)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Keystore (required — the release identity must stay stable)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 تنظیم نشده است. بدون کیستور اصلی، نسخهٔ ۱.۰.۲ روی ۱.۰.۱ آپدیت نمی‌شود و APK ساخته نمی‌شود."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build, align and sign (v1+v2+v3)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash tools/build_apk.sh "$VERSION"

      - name: Show verification report
        run: cat apksigner-verify.txt

      - name: Commit APK + refreshed download links
        run: |
          bash tools/update_download_links.sh "$VERSION" "TivaChat-V-Flash-v${VERSION}.apk"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk public/download README.md report/index.html index.html SHA256SUMS.txt apksigner-verify.txt
          git commit -m "release: v${VERSION} signed APK + download link" || echo "nothing to commit"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: TivaChat-V-Flash-v${{ env.VERSION }}
          path: |
            TivaChat-V-Flash-v${{ env.VERSION }}.apk
            SHA256SUMS.txt
            apksigner-verify.txt

      - name: Publish GitHub Release with APK asset
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TivaChat V Flash v${{ env.VERSION }}
          body_path: docs/REPORT-v1.0.3.md
          files: |
            TivaChat-V-Flash-v${{ env.VERSION }}.apk
            SHA256SUMS.txt
            apksigner-verify.txt
          fail_on_unmatched_files: true
