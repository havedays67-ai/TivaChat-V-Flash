 پردازشی وجود ندارد؛ پس از بوت، آیکون شناور در صورت فعال بودن برمی‌گردد.",tag:"محدودیت اندروید"},{title:"به‌روزرسانی بدون حذف",desc:"این ساخت با همان کلید امضای نسخهٔ قبلی (SHA-256 گواهی 2e3eee11…) منتشر شده و versionCode آن ۳ است. اگر نسخهٔ قبلی نصب است، همین فایل را نصب کنید و داده‌های برنامه حفظ می‌شود. نسخهٔ نمایشی همچنان ۱.۰.۰ است.",tag:"نصب"}],zb=[{q:"آیا تیواچت برای کار کردن به اینترنت نیاز دارد؟",a:"نه. تشخیص قصد، قواعد اجرا، گزارش‌های دستگاه و گاوصندوق رمزها کاملاً روی دستگاه انجام می‌شوند. فقط دانلود نسخه اولیه و کارهایی مثل جست‌وجوی وب که خودتان بخواهید به اینترنت نیاز دارند."},{q:"دستورات من یا رمزهایم به سرور فرستاده می‌شوند؟",a:"نه. هیچ متن گفتگو، رمز یا گزارش فنی به شبکه ارسال نمی‌شود. رمزهای گاوصندوق با AES-256-GCM و کلید محافظت‌شده در Android Keystore ذخیره می‌شوند و در لاگ یا ابر ثبت نمی‌شوند."},{q:"چرا تیواچت گاهی می‌پرسد «منظورتان این بود؟»",a:"وقتی اطمینان ترکیب موتور قواعد و پایگاه دانش محلی کمتر از آستانه باشد، اجرای حدسی می‌تواند خطرناک باشد. در این حالت دستیار متوقف می‌شود و گزینه‌های محتمل را برای تأیید نشان می‌دهد. این تصمیم بخشی از لایه ایمنی است، نه ضعف موتور."},{q:"چه دستوراتی واقعاً پشتیبانی می‌شوند؟",a:"باز کردن برنامه‌ها، گزارش باتری/رم/حافظه/دما، هدایت امن به تنظیمات، چراغ‌قوه، آلارم و تایمر، جست‌وجو، تماس و پیامک با تأیید، مدیریت برنامه‌ها و گالری، و مهم‌تر از همه دستورهای چندمرحله‌ای مثل «تلگرام را باز کن و به علی بنویس سلام». متن پیام فقط در کادر نوشته می‌شود و ارسال خودکار نیست. هر دستور خارج از این فهرست با شفاف‌سازی یا رد ایمن پاسخ می‌گیرد."},{q:"آیا می‌توانم رمز برنامه‌ها را به گاوصندوق بسپارم؟",a:"بله. رمزها رمزنگاری‌شده فقط روی دستگاه می‌مانند و برای مشاهده یا تکمیل خودکار، تأیید بیومتریک لازم است. ورود خودکار در برنامه‌های دارای FLAG_SECURE مثل برخی بانک‌ها ممکن نیست و صادقانه اطلاع داده می‌شود."},{q:"عملیات حساس چطور تأیید می‌شوند؟",a:"حذف برنامه، حذف فایل یا عکس، تماس، پیامک، تغییر تنظیمات حساس و دسترسی به رمزها همیشه دیالوگ تأیید جداگانه دارند. Safety Guard خارج از مدل است و مدل هیچ راهی برای دور زدن آن ندارد."},{q:"روی Redmi Note 8 Pro لگ می‌زند؟",a:"مدل ۳٬۹۳۲٬۱۸۰ پارامتری است و فقط هنگام تشخیص دستور، به‌صورت تنبل بارگذاری می‌شود؛ برای گفتگوهای ساده و قواعد، بارگذاری مدل لازم نیست. فایل مدل ۳٫۹۳ مگابایت (۲۴۸ کیلوبایت در APK) است. مصرف رم روی دستگاه هدف را ادعا نمی‌کنیم و اندازه‌گیری رسمی آن را در گزارش نیاورده‌ایم. عملیات سنگین پیش از اجرا نمایش داده می‌شوند."},{q:"فایل نصب نیاز به چه دسترسی‌هایی دارد و آیا امن است؟",a:"دسترسی‌ها در همین صفحه فهرست شده‌اند. تیواچت هیچ‌گاه روت نمی‌خواهد، فایل سیستمی را تغییر نمی‌دهد و کد برنامه‌های دیگر را دست‌کاری نمی‌کند. تمام اقدامات در یک لاگ محلی ثبت می‌شود تا همیشه قابل پیگیری باشد."},{q:"چطور تیواچت را وقتی داخل برنامه دیگری هستم باز کنم؟",a:"ضربه روی آیکون شناور (حالا مستقیماً پنجره را داخل سرویس باز می‌کند)، دو بار فشردن کلید صدا با دسترس‌پذیری، کاشی «تیواچت» در تنظیمات سریع، اعلان دائمی، و در صفحهٔ راهنما «نوار ژست لبه» با دو انگشت و دو ضربه. ژست دو انگشتی روی کل صفحه فقط در اندروید ۱۱+ از مسیر دسترس‌پذیری (حالت آزمایشی) در دسترس است و ممکن است لمس معمولی را تغییر دهد. وقتی گوشی کاملاً خاموش است هیچ اپی نمی‌تواند لمس یا صدا را تشخیص دهد؛ پس از روشن‌شدن و باز شدن قفل، آیکون شناور خودکار برمی‌گردد."},{q:"دستور «تلگرام رو باز کن و در پیام‌های شخصی بنویس سلام» چه کاری انجام می‌دهد؟",a:"این نسخه دستورهای چندمرحله‌ای را می‌فهمد: برنامه را باز می‌کند، با نام مخاطب گفتگو را جست‌وجو می‌کند و متن را فقط در کادر پیام می‌نویسد. اگر نام مخاطب را نگویید، قبل از هر کاری آن را می‌پرسد. برای ارسال، هرگز به‌صورت خودکار دکمه ارسال زده نمی‌شود و تأیید نهایی با خودتان است. این قابلیت به فعال بودن سرویس دسترس‌پذیری نياز دارد."},{q:"چرا در نسخهٔ قبلی با یک بار یا دو بار زدن آیکون، پنجره باز نمی‌شد؟",a:"پنجرهٔ قبلی با شروع یک اکتیویتی از پس‌زمینه باز می‌شد و اندروید ۱۰+ و MIUI می‌توانستند این کار را بی‌صدا مسدود کنند. در این ساخت، پنجرهٔ چت مستقیماً داخل همان سرویس شناور و روی پنجرهٔ Overlay باز می‌شود؛ بنابراین دیگر به شروع اکتیویتی از پس‌زمینه وابسته نیست. اگر باز هم مشکلی دیدید، در صفحهٔ راهنما بخش «وضعیت سرویس شناور» آخرین لمس و آخرین خطا را نشان می‌دهد."}, به‌روزرسانی
این ساخت با همان کلید امضای نسخهٔ قبلی منتشر شده است.
اگر نسخهٔ قبلی را نصب کرده‌اید، همین فایل را نصب کنید؛
داده‌های برنامه حفظ می‌شود و نیازی به حذف نیست.
نسخهٔ نمایشی همان ۱.۰.۰ است و versionCode داخلی ۳ شده است.

در نسخه ۱.۰.۰ (ساخت ۳)
• طبقه‌بند محلی آموزش‌دیده با ۳٬۹۳۲٬۱۸۰ پارامتر و کوانتایز INT8.
• ۱۴٬۸۵۸ نمونه آموزش متوازن، ۳٬۱۹۵ نمونه تست قالب‌محور و ۳۲ جملهٔ تازه.
• دقت ۹۳٫۷۵٪ روی جملات تازه و ۱۰۰٪ روی تست قالب‌محور (داده مصنوعی).
• رفع باگ باز نشدن پنجره: چت مستقیماً داخل سرویس شناور باز می‌شود.
• دو بار ضربه روی آیکون، دو انگشت روی آیکون، نوار ژست لبه و دو بار کلید صدا.
• ژست دو انگشتی کل صفحه در اندروید ۱۱+ (آزمایشی، با دسترس‌پذیری).
• نوشتن پیش‌نویس پیام در پیام‌رسان‌ها بدون ارسال خودکار.
• گاوصندوق AES-256-GCM، گزارش دستگاه، چراغ‌قوه، آلارم و تایمر.

نصب
۱) فایل APK را از همین صفحه یا انتشار رسمی گیت‌هاب دریافت کنید.
۲) اگر نسخهٔ قبلی نصب است، همان فایل را برای به‌روزرسانی نصب کنید.
۳) اجازهٔ «نمایش روی برنامه‌های دیگر» را برای آیکون شناور بدهید.
۴) دسترس‌پذیری را فقط برای نوشتن پیام و ژست‌ها فعال کنید.
۵) در MIUI، Autostart را روشن و محدودیت باتری را بردارید.
۶) برای گاوصندوق، قفل صفحه یا اثر انگشت تنظیم کنید.

محدودیت‌های صادقانه
• وقتی گوشی کاملاً خاموش است هیچ اپی نمی‌تواند لمس یا صدا را تشخیص دهد.
• ژست دو انگشتی روی کل صفحه بدون دسترس‌پذیری و اندروید ۱۱+ ممکن نیست.
• نوشتن پیام به سرویس دسترس‌پذیری نیاز دارد و ارسال خودکار نیست.
• پاک‌کردن کش سایر برنامه‌ها و ورود خودکار بانک‌ها طبق محدودیت اندروید ممکن نیست.
• این مدل مولد متن نیست؛ یک طبقه‌بند ۳٫۹ میلیون پارامتری است و دقت آن به همهٔ جملات تعمیم نمی‌یابد.
